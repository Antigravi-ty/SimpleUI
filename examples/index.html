<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function() {
      try {
        var saved = localStorage.getItem('simpleui-theme');
        if (saved === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) {}
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SimpleUI - Example Pages</title>
  <link rel="stylesheet" href="../showcase/patterns.css">
  <style>
    .ref-container {
      max-width: 680px;
      margin: 0 auto;
      padding: var(--ui-space-8) var(--ui-space-6);
      box-sizing: border-box;
    }
    .ref-top-nav {
      display: flex;
      align-items: center;
      margin-bottom: var(--ui-space-6);
    }
    .ref-empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: var(--ui-space-10) var(--ui-space-6);
      background-color: var(--ui-bg-surface);
      border: 1px dashed var(--ui-border-subtle);
      border-radius: var(--ui-radius-lg);
      box-shadow: var(--ui-shadow-sm);
      margin-top: var(--ui-space-4);
    }
    .ref-empty-state__icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      border-radius: var(--ui-radius-full);
      background-color: var(--ui-color-neutral-100);
      color: var(--ui-text-muted);
      margin-bottom: var(--ui-space-4);
    }
    .ref-empty-state__title {
      font-size: var(--ui-font-lg);
      font-weight: var(--ui-weight-semibold);
      margin: 0 0 var(--ui-space-2) 0;
      color: var(--ui-text-main);
    }
    .ref-empty-state__desc {
      font-size: var(--ui-font-sm);
      color: var(--ui-text-muted);
      max-width: 440px;
      line-height: 1.5;
      margin: 0 0 var(--ui-space-6) 0;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="app-header__brand">
        <a href="/" class="app-header__title">SimpleUI</a>
        <span class="ui-badge ui-badge--neutral ui-badge--sm ui-badge--pill">v2.1.0</span>
        <button id="theme-toggle" class="app-header__theme-toggle" aria-label="Toggle Theme" title="Toggle Theme">
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-moon"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        </button>
      </div>

      <div class="app-header__actions">
        <button type="button" id="safe-area-toggle" class="ui-btn ui-btn--sm ui-btn--neutral app-header__safe-area-btn" aria-label="Toggle Safe Area Overlay" title="Toggle Safe Area Overlay">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/></svg>
          <span>Safe Area</span>
        </button>
        <div class="app-header__scale-control" title="UI Scale (25% - 200%)">
          <span class="app-header__scale-label">Scale</span>
          <div class="ui-slider ui-slider--sm ui-slider--neutral app-header__scale-slider" data-unit="%">
            <input type="range" min="25" max="200" step="1" value="100" class="ui-slider__input" aria-label="UI Scale" data-unit="%">
            <span class="ui-slider__value">100%</span>
          </div>
        </div>
        <div class="ui-dropdown ui-dropdown--md ui-dropdown--neutral app-nav-dropdown">
          <button type="button" class="ui-dropdown__trigger" aria-haspopup="true" aria-expanded="false">
            <span class="ui-dropdown__trigger-text">Example Pages</span>
            <svg class="ui-dropdown__arrow" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="ui-dropdown__menu" role="menu"></div>
        </div>
      </div>
    </header>

    <div class="app-body">
      <main class="app-content" style="padding-top: var(--ui-space-6);">
        <div class="ref-container">
          <div class="ref-top-nav">
            <button type="button" class="ui-btn ui-btn--neutral ui-btn--sm" id="ref-back-btn" aria-label="Go back">
              ← Back
            </button>
          </div>

          <div style="margin-bottom: var(--ui-space-4);">
            <h1 style="font-size: var(--ui-font-2xl); font-weight: var(--ui-weight-bold); margin: 0 0 var(--ui-space-2) 0;">Example Pages</h1>
            <p style="font-size: var(--ui-font-base); color: var(--ui-text-muted); line-height: 1.5; margin: 0;">
              End-to-end reference application templates and real-world interfaces designed with SimpleUI.
            </p>
          </div>

          <div class="ref-empty-state">
            <div class="ref-empty-state__icon">
              <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                <line x1="3" y1="9" x2="21" y2="9"/>
                <line x1="9" y1="21" x2="9" y2="9"/>
              </svg>
            </div>
            <h2 class="ref-empty-state__title">Examples are currently empty</h2>
            <p class="ref-empty-state__desc">
              End-to-end application templates are currently in preparation. Community contributions and pull requests are welcome.
            </p>
            <button type="button" class="ui-btn ui-btn--neutral ui-btn--sm" id="ref-empty-back-btn">
              Return to Showcase
            </button>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script type="module" src="./examples.js"></script>
</body>
</html>
